# Every version the Android build uses, except those of Jackson, slf4j, JUnit, AssertJ and ArchUnit, and of PIT and its
# JUnit 5 plugin: the libraries below name the versions jackson, slf4j, junit, assertj and archunit, and app/ the
# versions pitest and pitest-junit5, which the settings (android/ and build-logic/) read from the Maven build's pom.xml
# (maven-poms/, MavenVersions), so a Maven update of one of them reaches this build too. A version that pom.xml lacks
# fails the build while it configures.
[versions]
# the oldest Android the app runs on (Android 10) and the API it is compiled against, for :app and :engine-lint
android-min-sdk = "29"
android-compile-sdk = "37"
agp = "9.5.1"
kotlin = "2.4.21"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
desugar-jdk-libs = "2.1.5"
androidx-test = "1.7.0"
androidx-test-junit = "1.3.0"
# Espresso for the screens' tests on Robolectric, above the version Compose's test rule brings, #321
androidx-test-espresso = "3.7.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
robolectric = "4.17"
# the phone-only preferences (the "Wi-Fi only" switch, and the notifications' state), #361
datastore = "1.3.0"
# NotificationCompat and NotificationManagerCompat; the version the Compose BOM's libraries bring already
androidx-core = "1.19.1"
# the hourly round while the app is closed (#362); work-runtime and work-testing at this one version. No
# work-runtime-ktx: it is empty since 2.8, its Kotlin API is in work-runtime
work = "2.12.0"
# the Android fork of the PIT plugin, for :app's mutation testing (pitestDebug); PIT's own version comes from pom.xml
droidsonroids-pitest = "0.3.0"

[libraries]
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-core = { module = "tools.jackson.core:jackson-core" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# runs the screens' JUnit 4 tests on Robolectric beside the JUnit 5 ones, at the BOM's version
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
# Material's icons as Compose code (Up, the home's Settings, the check on a chosen place's card, Location and the
# licences' row in Settings), at the BOM's version; Apache-2.0, named in android/legal/apache-2.0.txt as
# material-icons-core-android, the variant that brings the aar. Settings' other icons are copied from
# material-icons-extended-android into ui/settings/SettingsIcons.kt, which stays no dependency
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
# the screens' view models with their SavedStateHandle, and state that follows the screen's lifecycle
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
# the phone-only preferences store: the "Wi-Fi only" switch, and the notifications' state (docs/privacy.md)
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# the notifications, their channels and whether they are allowed, as one API on every Android the app runs on
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
# the hourly round while the app is closed and the one round asked at once (#362); brings Room, SQLite and AndroidX
# Startup, whose default initializer starts WorkManager
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
# WorkManager's test driver and initializer for the Robolectric tests of the background work
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# the screens' tests on the JVM: Android's classes from Robolectric, Compose's test rule and the manifest it needs
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
desugar-jdk-libs-nio = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar-jdk-libs" }
# the instrumented tests' runner and JUnit 4 rules, for androidTest only: they never reach the APK
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[bundles]
# the engine's own libraries, for :engine and :engine-lint alike; the BOM comes with them as a platform
engine = ["jackson-databind", "jackson-core", "slf4j-api"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
pitest = { id = "pl.droidsonroids.pitest", version.ref = "droidsonroids-pitest" }
