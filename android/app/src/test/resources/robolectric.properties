# the screens' tests run on the SDK the app is compiled against, and only on that one; one test of HomeScreenTest
# runs on 36, which says why (#321)
sdk=37
# Android's own text and graphics, so a text is as tall as on a phone and a control is drawn at its real size
# (ScreenChecks); Robolectric's older stand-in gives every text one height, which hides a button drawn too small
graphicsMode=NATIVE
