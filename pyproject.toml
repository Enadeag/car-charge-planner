[build-system]
requires = ["hatchling>=1.27", "babel"]
build-backend = "hatchling.build"

[project]
name = "car-charge-planner"
version = "0.2.0"
description = "Tells you when to charge your electric car so that as much of the power as possible comes from your own solar panels."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "ADDITIONAL-TERMS.md"]
authors = [{ name = "Kelvin Vroegop" }]
keywords = ["solar", "electric vehicle", "ev charging", "forecast", "tray"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "PySide6-Essentials",
    "platformdirs",
    "tzlocal",
    'jeepney; sys_platform == "linux"',
    "keyring",  # API keys and tokens: Secret Service, Credential Manager or Keychain
    "tzdata",  # zone data on every system, so the app does not depend on the system providing it
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright", "babel", "hatchling"]  # babel and hatchling: also the build requirements (a test builds the wheel)

[project.urls]
Homepage = "https://github.com/Enadeag/car-charge-planner"
Source = "https://github.com/Enadeag/car-charge-planner"
Issues = "https://github.com/Enadeag/car-charge-planner/issues"

# The command is a console script. The Windows installer's program is a windowed one, with a console twin (installers/windows).
[project.scripts]
car-charge-planner = "car_charge_planner.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/car_charge_planner"]
artifacts = ["*.mo"]  # compiled translations are not in git, so they are named here to be included

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "tools", "installers", "README.md", "LICENSE", "NOTICE", "ADDITIONAL-TERMS.md", "CHANGELOG.md", "CONTRIBUTING.md", "CONTEXT.md", "babel.cfg", "hatch_build.py", "pyproject.toml"]
artifacts = ["*.mo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "linux: only makes sense on Linux; skipped on other systems",
    "windows: only makes sense on Windows; skipped on other systems",
    "macos: only makes sense on macOS; skipped on other systems",
]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "I", "PLW1514"]  # syntax errors, pyflakes (unused names), bugbear, pyupgrade, import sorting, text files opened without an encoding
preview = true  # PLW1514 is still a preview rule; with explicit-preview-rules no other preview rule is switched on
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E741"]  # tests set QT_QPA_PLATFORM before importing Qt; short names like `l` are fine there

[tool.pyright]
include = ["src"]  # tests are left out: they poke Qt widgets and private attributes, which is mostly stub noise
pythonVersion = "3.12"
typeCheckingMode = "basic"
strict = ["src/car_charge_planner/planner", "src/car_charge_planner/config", "src/car_charge_planner/forecast", "src/car_charge_planner/engine", "src/car_charge_planner/app_settings.py"]  # the packages without Qt
