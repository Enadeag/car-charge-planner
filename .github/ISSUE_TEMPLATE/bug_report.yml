name: Bug report
description: Something does not work as it should
labels: [needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options: [Desktop (Linux or Windows), Android]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "The release you installed (Settings, About shows it), or the commit if you run from a clone"
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop and session, or Android phone
      description: "For example: KDE Plasma 6 on Wayland, GNOME 47 on X11; or Pixel 8, Android 15"
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: "Desktop only: tray icon or window?"
      options: [Tray icon, Window, Not sure]
  - type: textarea
    id: log
    attributes:
      label: The log, around the time it happened
      description: >-
        The app logs what it did to car-charge-planner.0.log in its data folder (Settings, About shows where):
        ~/.local/share/car-charge-planner on Linux, %LOCALAPPDATA%\car-charge-planner on Windows. Paste the lines
        around the problem, or the output of the terminal if you ran it in one. Read them first: the log holds no API
        keys or coordinates, but its paths show your user name, and you may want to remove that. On Android, paste
        only the app's own Logcat lines around the problem, not a full bug report of the phone, which holds much more
        than this app's log. The debug build logs at DEBUG level, so its lines may also hold your trips' departure times
        and the charge windows' times: remove those before you paste.
      render: text
