name: Feature request
description: An idea for something the app could do
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation first, then the idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
