# Dependabot proposes new versions of the libraries and plugins in pom.xml, of those of the Android build (android/,
# its version catalog), and of the actions in the workflows, as pull requests. A version update waits a week after its
# release; a security update (switched on in the repository's settings) does not wait.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  # Jackson, slf4j, JUnit, AssertJ and ArchUnit are left to the Maven updates: the Android build reads their versions
  # from pom.xml while it configures (android/maven-poms, MavenVersions), so a Maven update reaches it too and the
  # catalog has no version of theirs to update. The same holds for PIT's and pitest-junit5's versions, which come from
  # pom.xml too; the Gradle ecosystem updates only droidsonroids-pitest. Robolectric's Android jars follow Robolectric's
  # version, not a release of their own (RobolectricSdkJarsTest). An update of the Android build, here or through
  # pom.xml, fails Gradle's dependency verification until its pull request carries the refreshed
  # android/gradle/verification-metadata.xml: run sh tools/refresh-android-verification.sh on its branch and commit the
  # file, by hand, as no workflow may write to a pull request (#484).
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "tools.jackson*"
      - dependency-name: "org.slf4j:*"
      - dependency-name: "org.junit*"
      - dependency-name: "org.assertj:*"
      - dependency-name: "com.tngtech.archunit:*"
      - dependency-name: "org.robolectric:android-all-instrumented"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
