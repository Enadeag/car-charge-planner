# Dependabot proposes new versions of the libraries and plugins in pom.xml, of those of the Android build (android/,
# its version catalog), and of the actions in the workflows, as pull requests. A version update waits a week after its
# release; a security update (switched on in the repository's settings) does not wait.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  # Jackson, slf4j, JUnit, AssertJ and ArchUnit are left to the Maven updates: the Android build reads their versions
  # from pom.xml while it configures (android/maven-poms, MavenVersions), so a Maven update reaches it too and the
  # catalog has no version of theirs to update. The same holds for PIT's and pitest-junit5's versions, which come from
  # pom.xml too; the Gradle ecosystem updates only droidsonroids-pitest.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "tools.jackson*"
      - dependency-name: "org.slf4j:*"
      - dependency-name: "org.junit*"
      - dependency-name: "org.assertj:*"
      - dependency-name: "com.tngtech.archunit:*"
      # Until the app builds on compileSdk 37, #321, which removes these three entries: newer releases need it.
      # The BOM by version range: its 2026.07 and 2026.08 still build on 36, and as it holds no code of its own it
      # never brings a security update.
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">= 2026.09.00"]
      # Lifecycle and WorkManager by update type, not by version range, so a security update of a patch version still
      # comes; a version range would hold that back too. A minor or major release is taken to need 37, as 2.11 of
      # Lifecycle does; WorkManager 2.12 needs 35.
      - dependency-name: "androidx.lifecycle:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.work:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
