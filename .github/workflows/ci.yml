name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Documentation alone needs no build: then the jobs below are skipped (GitHub counts a skipped job as passed, so a
  # ruleset that requires them does not block the pull request) and only the tests that guard the documents run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did anything but documentation change?
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "$files"
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*.py) code=true ;;
              docs/*|*.md|LICENSE|NOTICE|.github/ISSUE_TEMPLATE/*) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests that guard the documents
        run: pytest -q tests/test_docs_neutral.py tests/test_readme_privacy.py tests/test_provider_guide.py

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: System libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check .
      - name: Type check
        run: pyright
      - name: Compile the translations
        # Fails on a broken catalogue. There are no catalogues yet (only the template), and compile then errors: skip until the first one.
        run: |
          if [ -n "$(find src/car_charge_planner/locale -name '*.po')" ]; then
            python -m car_charge_planner.i18n_tools compile
          else
            echo "No translation catalogues yet: nothing to compile."
          fi
      - name: Test
        run: pytest -q

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (each file in its own process, so a crash hides only that file)
        run: |
          $failed = @()
          foreach ($file in Get-ChildItem tests -Filter 'test_*.py' | Sort-Object Name) {
            pytest -q -rfE -p no:cacheprovider $file.FullName
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 5) { $failed += "$($file.Name) (exit code $LASTEXITCODE)" }
          }
          if ($failed) { "Failed or crashed:"; $failed; exit 1 }
          exit 0

  macos:
    # Remove this condition at the public launch (#31): macOS minutes cost 10x while the repository is private.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true  # informational until a person has checked a release on a Mac (#29)
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
