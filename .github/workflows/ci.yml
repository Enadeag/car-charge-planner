name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes; runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Documentation alone needs no build: then linux and windows are skipped, and GitHub counts a skipped job as passed,
  # so a ruleset that requires them does not block the pull request.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      engine: ${{ steps.diff.outputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did anything but documentation change?
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "engine=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "$files"
          code=false
          engine=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/example-engine.json) code=true ;;  # the tests read it
              docs/*|*.md|LICENSE|NOTICE|.github/ISSUE_TEMPLATE/*) ;;
              *) code=true ;;
            esac
            # what the engine's Java 17 run depends on: its sources, the example file its tests read, the build
            case "$file" in
              engine/*|docs/example-engine.json|pom.xml|*/pom.xml|mvnw|.mvn/*|.github/workflows/ci.yml) engine=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: System programs for the tests (D-Bus, GNOME Keyring, desktop-file-validate)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-daemon gnome-keyring desktop-file-utils
      # CCP_REQUIRE_PLATFORM: a test whose system program is missing fails here, where it would be skipped elsewhere
      - name: Build and test, with the coverage floors
        env:
          CCP_REQUIRE_PLATFORM: "1"
        run: ./mvnw -B clean verify -Pcoverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: surefire-reports-linux
          path: |
            engine/target/surefire-reports/
            desktop/target/surefire-reports/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: |
            engine/target/site/jacoco/
            desktop/target/site/jacoco/
          retention-days: 7

  # The engine is compiled for Java 17 (--release 17) but the linux job runs its tests on Java 25. Here Maven and
  # javac stay on Java 25, so the compiler flags are the same; only the test JVM that surefire forks is Temurin 17,
  # through its jvm parameter. The last JDK installed is the default, and the other is found in JAVA_HOME_17_X64.
  engine-java17:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
          cache: maven
      - name: The engine's tests on Java 17
        run: |
          "${JAVA_HOME_17_X64:?}/bin/java" -version
          ./mvnw -B -pl engine -am test -Djvm="$JAVA_HOME_17_X64/bin/java"
      - name: The tests ran on Java 17
        run: grep -q 'name="java.specification.version" value="17"' engine/target/surefire-reports/TEST-*.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: surefire-reports-engine-java17
          path: engine/target/surefire-reports/
          retention-days: 7

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        env:
          CCP_REQUIRE_PLATFORM: "1"
        run: .\mvnw.cmd -B clean verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: surefire-reports-windows
          path: |
            engine/target/surefire-reports/
            desktop/target/surefire-reports/
          retention-days: 7
