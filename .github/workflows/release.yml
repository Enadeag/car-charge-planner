name: Release

# A tag vX.Y.Z builds and tests the app, packages the Linux tar.gz, .deb and .rpm and the Windows installer with an SBOM
# for Linux and one for Windows, checks the SBOMs for known vulnerabilities, attests where the files were built, and attaches them, with SHA256SUMS, to a
# DRAFT GitHub Release; it also creates the branch release/X.Y.Z at the tag. Nothing is ever published
# here: the maintainer reads the draft and publishes it by hand. The tag must be "v" plus the version in pom.xml, which
# has no -SNAPSHOT at a release (CONTRIBUTING.md, Releasing).
#
# Dry run: start this workflow by hand (Actions, Release, Run workflow, on main). It builds everything and makes a draft
# called "dry run", without the tag check, the attestations and the release branch; a missing changelog section only
# warns.
#
# The release builds use one exact Java version, which the packages bring as their runtime and the release notes name:
# the java-version of every setup-java here and in windows-installer.yml (ReleaseWorkflowTest keeps them the same).
# Moving to a new Java update is a pull request (CONTRIBUTING.md, Java updates). They use no Maven cache, which another
# workflow run could have filled.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25.0.4.1+1"
      - name: Read the version and compare it with the tag
        id: version
        run: |
          version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pom.xml version: $version"
          [ "$GITHUB_EVENT_NAME" = "push" ] || exit 0
          case "$version" in
            *-SNAPSHOT)
              echo "::error::pom.xml says $version: a release commit sets the version without -SNAPSHOT before it is tagged"
              exit 1 ;;
          esac
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in pom.xml, $version (expected tag v$version)"
            exit 1
          fi
      # here, not in the release job, which holds a token that can write to the repository
      - name: Release notes, from the CHANGELOG.md section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes/notes.md"
          mkdir "$RUNNER_TEMP/notes"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            java tools/ReleaseNotes.java "$VERSION" CHANGELOG.md > "$notes"
          else
            printf 'Dry run of the release workflow (run %s, version %s). Delete this draft.\n\n' \
              "$GITHUB_RUN_ID" "$VERSION" > "$notes"
            java tools/ReleaseNotes.java "${VERSION%-SNAPSHOT}" CHANGELOG.md >> "$notes" \
              || echo "::warning::CHANGELOG.md has no section for ${VERSION%-SNAPSHOT} yet; a tag would stop here"
          fi
          cat "$notes"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/notes.md
          if-no-files-found: error
          retention-days: 14
      - name: Stop early if release/X.Y.Z already points elsewhere
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # gh prints the 404 body on stdout when the branch does not exist, so only trust its output on success.
          if ! existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/$VERSION" --jq .object.sha 2>/dev/null); then
            existing=""
          fi
          if [ -n "$existing" ] && [ "$existing" != "$(git rev-parse HEAD)" ]; then
            echo "::error::release/$VERSION exists at $existing, not at this tag ($(git rev-parse HEAD)); not moving it"
            exit 1
          fi

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25.0.4.1+1"
      # fakeroot and rpm (with rpmbuild) for the .deb and .rpm, and desktop-file-validate for the .deb's smoke test
      - name: D-Bus and GNOME Keyring for the tests on a private bus, and the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-daemon gnome-keyring fakeroot rpm \
            desktop-file-utils
      - name: Build and test
        run: ./mvnw -B clean verify
      - name: Package
        run: sh tools/package-linux.sh
      - name: Smoke test the unpacked download
        # "quit" with no copy running starts the runtime and the app, finds nothing to quit and exits with 0; an
        # unknown command exits with 2, which shows the exit code really comes from the app
        run: |
          tarball=$(ls target/dist/car-charge-planner-*-linux.tar.gz)
          if tar --numeric-owner -tvzf "$tarball" | awk '$2 != "0/0"' | grep .; then
            echo "::error::these entries in the tar.gz are not owned by root"; exit 1
          fi
          mkdir "$RUNNER_TEMP/unpacked"
          tar -C "$RUNNER_TEMP/unpacked" -xzf "$tarball"
          if [ ! -f "$RUNNER_TEMP/unpacked/car-charge-planner/legal/LICENSE" ]; then
            echo "::error::the tar.gz has no legal/LICENSE"; exit 1
          fi
          app="$RUNNER_TEMP/unpacked/car-charge-planner/bin/car-charge-planner"
          "$app" quit
          status=0; "$app" no-such-command || status=$?
          if [ "$status" -ne 2 ]; then echo "::error::unknown command: exit code $status, expected 2"; exit 1; fi
      - name: Smoke test the .deb, installed on this runner
        run: |
          # dpkg does not fetch what the .deb depends on; apt-get -f installs what is missing and finishes the install
          sudo dpkg -i target/dist/car-charge-planner_*_amd64.deb || sudo apt-get install -f -y --no-install-recommends
          dpkg -s car-charge-planner | grep -qx "Status: install ok installed"
          app=/opt/car-charge-planner/bin/car-charge-planner
          status=0; "$app" bogus || status=$?
          if [ "$status" -ne 2 ]; then echo "::error::installed .deb, unknown command: exit code $status, expected 2"; exit 1; fi
          out=$("$app" quit)
          echo "$out"
          if [ "$out" != "Car charge planner is not running." ]; then echo "::error::installed .deb, quit said: $out"; exit 1; fi
          entry=$(find /usr -name car-charge-planner-car-charge-planner.desktop)
          if [ -z "$entry" ]; then echo "::error::the .deb installed no menu entry"; exit 1; fi
          desktop-file-validate "$entry"
          sudo dpkg -r car-charge-planner
          if [ -e /opt/car-charge-planner ] || [ -e "$entry" ]; then
            echo "::error::removing the .deb left files behind"; exit 1
          fi
      - name: Check the files in the .rpm
        run: |
          rpm=$(ls target/dist/car-charge-planner-*.x86_64.rpm)
          rpm -qip "$rpm"
          files=$(rpm -qlp "$rpm")
          for file in bin/car-charge-planner lib/app/car-charge-planner.jar lib/car-charge-planner.png \
              lib/car-charge-planner-car-charge-planner.desktop legal/LICENSE; do
            if ! printf '%s\n' "$files" | grep -qx "/opt/car-charge-planner/$file"; then
              echo "::error::the .rpm has no /opt/car-charge-planner/$file"; exit 1
            fi
          done
          if ! rpm -qp --scripts "$rpm" | grep -q "xdg-desktop-menu install /opt/car-charge-planner/lib/car-charge-planner-car-charge-planner.desktop"; then
            echo "::error::the .rpm does not install its menu entry"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-download
          path: |
            target/dist/car-charge-planner-*-linux.tar.gz
            target/dist/car-charge-planner_*_amd64.deb
            target/dist/car-charge-planner-*.x86_64.rpm
            target/dist/car-charge-planner-*-linux.cdx.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: surefire-reports-linux
          path: target/surefire-reports/
          retention-days: 14

  installer:
    needs: prepare
    uses: ./.github/workflows/windows-installer.yml

  # The release gate on known vulnerabilities, in a job without write access: tools/scan-sbom.sh fails on any finding
  # that osv-scanner.toml does not list.
  scan:
    needs: [linux, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-download
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: release
      - name: Check the SBOMs against the OSV vulnerability database
        run: sh tools/scan-sbom.sh release/*.cdx.json

  # Signing: the installer is unsigned until the public launch (docs/adr/0003-pyinstaller-unsigned-until-signpath.md).
  # At the launch the SignPath Foundation signs it from this runner; the step below is prepared for that and stays
  # skipped while the secret SIGNPATH_API_TOKEN does not exist. It is deliberately not wired up yet: the SignPath
  # organisation, project and signing-policy slugs, and signing before the checksums are made, come with the launch.
  release:
    needs: [prepare, linux, installer, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # create the draft release and push release/X.Y.Z
      id-token: write  # the attestations: a token that says which workflow run built the files
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      DRY_RUN: ${{ github.event_name != 'push' }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      # keeps the token in the checkout: the release branch is pushed with git. Nothing from the repository runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-download
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: release
      - name: Sign the installer (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          echo "::error::SignPath signing is prepared but not wired up yet; see the comment above this job"
          exit 1
      - name: Checksums
        run: |
          cd release
          ls car-charge-planner-*-linux.tar.gz car-charge-planner_*_amd64.deb car-charge-planner-*.x86_64.rpm \
            car-charge-planner-*.exe car-charge-planner-*-linux.cdx.json car-charge-planner-*-windows.cdx.json
          if [ "$(ls | wc -l)" -ne 6 ]; then
            echo "::error::expected the tar.gz, the .deb, the .rpm, the installer and the two SBOMs only"; ls -l; exit 1
          fi
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # Not in a dry run: its files are not a release, and while the repository is private it cannot make attestations.
      - name: Attest where the files were built
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/car-charge-planner-*-linux.tar.gz
            release/car-charge-planner_*_amd64.deb
            release/car-charge-planner-*.x86_64.rpm
            release/car-charge-planner-*.exe
            release/car-charge-planner-*.cdx.json
      - name: Create the release branch
        if: env.DRY_RUN != 'true'
        # With rulesets on release/** and v* after the public launch, this token needs the maintainer's bypass,
        # or the branch is created by hand before the tag is pushed.
        run: |
          branch="release/$VERSION"
          existing=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          if [ -z "$existing" ]; then
            git push origin "${GITHUB_REF_NAME}^{commit}:refs/heads/$branch"
          elif [ "$existing" != "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" ]; then
            echo "::error::$branch exists at $existing, not at tag $GITHUB_REF_NAME; not moving it"
            exit 1
          fi
      - name: Create the draft release
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            gh release create "dry-run-$GITHUB_RUN_ID" release/* --draft --target "$GITHUB_SHA" \
              --title "dry run" --notes-file "$RUNNER_TEMP/notes/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
              --title "Car charge planner $VERSION" --notes-file "$RUNNER_TEMP/notes/notes.md"
          fi
