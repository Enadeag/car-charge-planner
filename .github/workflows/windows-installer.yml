name: Windows installer

# Windows minutes count double while the repository is private, so the installer is built when what goes into it
# changes on main and by hand; not for every pull request. A version tag builds it through release.yml, which calls this.
on:
  push:
    branches: [main]
    paths:
      - "tools/package-windows.ps1"
      - "src/packaging/windows/**"
      - "pom.xml"
      - ".mvn/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: WiX 5
        # WiX 6 and later ask to accept a maintenance fee agreement first; jpackage finds wix.exe on the PATH
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE) { exit 1 }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: WiX 5 extensions
        run: |
          wix extension add -g WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE) { exit 1 }
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE) { exit 1 }
      - name: Build the installer (runs the tests too)
        run: powershell -ExecutionPolicy Bypass -File tools\package-windows.ps1
      - name: Install, smoke test and uninstall
        run: |
          $setup = Get-ChildItem target\dist\car-charge-planner-*.exe
          $upgradeCode = "{93C62923-67A1-4866-AF93-AC179A22A9F0}"  # --win-upgrade-uuid in tools\package-windows.ps1
          $app = "$env:LOCALAPPDATA\Programs\car-charge-planner\car-charge-planner.exe"
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
          $msi = New-Object -ComObject WindowsInstaller.Installer

          # jpackage's exe hands its arguments to the MSI inside it
          $step = Start-Process $setup.FullName -ArgumentList "/quiet", "/norestart" -Wait -PassThru
          if ($step.ExitCode -ne 0) { "install: exit code $($step.ExitCode)"; exit 1 }
          if (-not (Test-Path $app)) { "nothing installed at $app"; exit 1 }
          if (-not (Get-ChildItem $menu -Recurse -Filter car-charge-planner.lnk)) { "no Start menu shortcut"; exit 1 }

          # "quit" with no copy running starts the runtime and the app, finds nothing to quit and exits with 0; an
          # unknown command exits with 2, which shows the exit code really comes from the app
          $run = Start-Process $app -ArgumentList "quit" -Wait -PassThru
          if ($run.ExitCode -ne 0) { "installed app, quit: exit code $($run.ExitCode)"; exit 1 }
          $run = Start-Process $app -ArgumentList "no-such-command" -Wait -PassThru
          if ($run.ExitCode -ne 2) { "installed app, unknown command: exit code $($run.ExitCode), expected 2"; exit 1 }

          $products = @($msi.RelatedProducts($upgradeCode))
          if ($products.Count -ne 1) { "expected one installed product, found $($products.Count)"; exit 1 }
          $step = Start-Process msiexec.exe -ArgumentList "/x", $products[0], "/quiet", "/norestart" -Wait -PassThru
          if ($step.ExitCode -ne 0) { "uninstall: exit code $($step.ExitCode)"; exit 1 }
          if ((Test-Path $app) -or (Get-ChildItem $menu -Recurse -Filter car-charge-planner.lnk) -or @($msi.RelatedProducts($upgradeCode)).Count) {
            "the uninstaller left something behind"; exit 1
          }
          "installed, started and removed cleanly"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: target/dist/car-charge-planner-*.exe
          if-no-files-found: error
          retention-days: 14
