name: Android

# The Android app (android/, ADR 0010). The build job builds the app and its test APK, runs Android Lint and then
# check (the unit tests and the build's own checks), and keeps the debug APK for 14 days, to install on a phone (not
# for a pull request from a fork). It runs for a pull request that touches android/, the engine's sources, a pom.xml
# (the build takes the versions of the engine's libraries from pom.xml, and checkMavenDrift holds it to the libraries
# of engine/pom.xml) or this file, and always on a push, weekly and by hand. The emulator job runs the instrumented
# tests on an Android 10 (API 29) emulator: for release/android-* branches and the pull requests into them, weekly, by
# hand, and for a pull request that changes this file. (CONTRIBUTING.md, What is tested where)
on:
  push:
    branches: [main, "release/android-*"]
  pull_request:
  schedule:
    - cron: "41 4 * * 2"  # Tuesdays, 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes; runs on main, release branches and the weekly run finish.
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a pull request needs. A skipped job counts as passed, so a ruleset that requires them does not
  # block a pull request that does not touch the app. The job names start with android-, as a ruleset tells checks
  # apart by name only, and ci.yml has a job called changes that main requires.
  android-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      emulator: ${{ steps.decide.outputs.emulator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Which jobs does this run need?
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          build=false
          emulator=false
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              case "$BASE_REF" in release/android-*) emulator=true ;; esac
              if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
                build=true
              else
                # unquoted names (a non-ASCII name stays as it is), NUL-separated, and a move as its two paths; into a
                # file first, so a failing git diff fails the step
                list=$(mktemp)
                git -c core.quotePath=false diff --name-only -z --no-renames "$BASE" "$GITHUB_SHA" > "$list"
                while IFS= read -r -d '' file; do
                  printf '%s\n' "$file"
                  case "$file" in
                    .github/workflows/android.yml) build=true; emulator=true ;;
                    android/*|engine/src/*|pom.xml|*/pom.xml) build=true ;;
                  esac
                done < "$list"
              fi
              ;;
            push)
              build=true
              case "$GITHUB_REF" in refs/heads/release/android-*) emulator=true ;; esac
              ;;
            *)
              build=true
              emulator=true
              ;;
          esac
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "emulator=$emulator" >> "$GITHUB_OUTPUT"

  android-build:
    needs: android-changes
    if: needs.android-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # the commit in the debug version name: a pull request's own head, not the merge commit GITHUB_SHA names there
      BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # Checks gradle-wrapper.jar against Gradle's published checksums; the cache is the open-source one (basic),
      # written from main only.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Android SDK platform 36 and build-tools 36.0.0
        id: sdk
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build the app and its test APK
        run: ./gradlew --continue --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Android Lint
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: ./gradlew --continue --stacktrace lint
      - name: Unit tests and the build's checks
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: ./gradlew --continue --stacktrace check
      # The debug APK to install on a phone (CONTRIBUTING.md, The Android app), kept even when lint or the tests failed;
      # the step fails when the build left no APK. Not for a pull request from a fork, which runs code from outside the
      # repository, nor for Dependabot's (its author, so a re-run by the maintainer skips it too). The attempt is in the
      # name, so a re-run of failed jobs does not meet the artifact of the first attempt.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          ${{ !cancelled() && steps.sdk.outcome == 'success'
          && (github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]')) }}
        with:
          name: android-debug-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-reports
          path: |
            android/*/build/reports/
            android/*/build/test-results/
          retention-days: 7

  android-emulator:
    needs: android-changes
    if: needs.android-changes.outputs.emulator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # Read only: the build job writes the cache, under the same key.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      # the same as in android-build
      - name: Android SDK platform 36 and build-tools 36.0.0
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      # the udev rule from the emulator action's README, so the emulator can use KVM
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # names the emulator action's version: update it with the action's pin, so a new version makes a new AVD. A
          # Dependabot pull request that bumps the emulator action must bump this suffix too, in the same pull request.
          key: avd-29-default-x86_64-emulator-runner-v2.38.0
      # The watchdog (#357): the action starts the emulator with its own output pipes, and the emulator's processes,
      # crashpad_handler among them, inherit them; one that outlives the emulator keeps the action, and so the step,
      # running (upstream https://github.com/ReactiveCircus/android-emulator-runner/issues/385, cause and fix in the
      # open https://github.com/ReactiveCircus/android-emulator-runner/pull/497). It starts here, so it also covers a
      # failed boot, which ends the step before its script, and it waits for the emulator directory, as the action
      # installs the emulator in its own step. Detached, it holds none of the step's pipes. It acts only on processes
      # whose program is in that directory, never on the emulator or its qemu, so a snapshot being saved and the next
      # step's emulator are safe; and only once they have been gone 20 seconds, so what exits by itself after `emu kill`
      # goes first. It can go once a release of the action fixes the hang; the steps' timeouts end what it misses.
      - name: Start the emulator watchdog
        env:
          WATCHDOG: |
            out="${GITHUB_WORKSPACE:?}/android/build/emulator-processes.txt"
            poll=3 grace=20 limit=2400
            list() {
              {
                echo "== $1, $(date -u +%H:%M:%S)"
                ps -eo pid,ppid,pgid,etime,args |
                  awk -v me="$$" -v re='[q]emu|[c]rashpad|[n]etsim|[e]mulator|[a]db' 'NR == 1 || ($1 != me && $0 ~ re)'
              } >> "$out"
            }
            # one "PID KIND" line per process whose program is in "$dir": run for the emulator and its qemu
            scan() {
              LC_ALL=C ls -l /proc/[0-9]*/exe 2> /dev/null | while IFS= read -r line; do
                pid=${line%%/exe -> *}
                case "${line#* -> }" in
                  "$dir"/emulator | "$dir"/qemu/*) echo "${pid##*/proc/} run" ;;
                  "$dir"/*crashpad_handler) echo "${pid##*/proc/} crashpad" ;;
                  "$dir"/*) echo "${pid##*/proc/} other" ;;
                esac
              done
            }
            # reap SIGNAL KINDS: fails, and signals nothing, once an emulator runs again
            reap() {
              procs=$(scan)
              case "$procs" in *run*) return 1 ;; esac
              echo "$procs" | while read -r pid kind; do
                case " $2 " in *" $kind "*) kill "-$1" "$pid" 2> /dev/null || : ;; esac
              done
            }
            # the action installs the emulator after this starts: no scan until the directory passes the check
            dir= seen= stopped=
            end=$(($(date +%s) + limit))
            while [ "$(date +%s)" -lt "$end" ]; do
              if [ -z "$dir" ]; then
                found=$(readlink -f "${ANDROID_HOME:-/nonexistent}/emulator") && [ -x "$found/emulator" ] &&
                  [ "${found##*/}" = emulator ] && dir=$found
                [ -n "$dir" ] || { sleep "$poll"; continue; }
              fi
              case "$(scan)" in
                *run*) seen=1 stopped= ;;
                *)
                  now=$(date +%s)
                  if [ -n "$seen" ] && [ $((now - ${stopped:=$now})) -ge "$grace" ]; then
                    list "the emulator stopped $grace seconds ago"
                    reap TERM crashpad; sleep 5; reap KILL "crashpad other"
                    sleep 1
                    list "after the kill"
                    seen= stopped=
                  fi
                  ;;
              esac
              sleep "$poll"
            done
            [ -n "$dir" ] || echo "== no watchdog: no emulator directory in ANDROID_HOME in $limit seconds" >> "$out"
        run: |
          mkdir -p android/build
          setsid sh -c "$WATCHDOG" < /dev/null > /dev/null 2>&1 &
      # On a cache miss: boot the new AVD once and keep its snapshot, so the next runs start from it.
      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "The AVD and its snapshot are made."
      # api-level, target and arch the same as in the snapshot step, or the snapshot does not match the AVD. Each script
      # line runs in a shell of its own; logcat runs in the background, apart from the step's output, until the emulator
      # stops.
      - name: Instrumented tests on API 29
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: |
            mkdir -p build
            adb logcat -v threadtime < /dev/null > build/logcat.txt 2>&1 &
            ./gradlew --continue --stacktrace :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-emulator-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/build/logcat.txt
            android/build/emulator-processes.txt
          retention-days: 7
