name: Mutation testing

# Weekly and by hand: PIT on the engine and on the desktop's logic that needs no JavaFX (the pit profile in pom.xml),
# each failing below its threshold and keeping its HTML report for 14 days, and the whole build with the test classes
# in a fresh random order, which shows a test that depends on the ones before it. A pull request into main that
# touches the engine or its tests runs PIT on the engine only. (CONTRIBUTING.md, What is tested where)
on:
  schedule:
    - cron: "23 3 * * 1"  # Mondays, 03:23 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/main/java/nl/enadeag/carchargeplanner/engine/**
      - src/test/java/nl/enadeag/carchargeplanner/engine/**

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: PIT on the engine
        run: ./mvnw -B -Ppit test-compile pitest:mutationCoverage@engine
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pit-report-engine
          path: target/pit-reports/engine/
          retention-days: 14

  desktop:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: PIT on the desktop's logic
        run: ./mvnw -B -Ppit test-compile pitest:mutationCoverage@desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pit-report-desktop
          path: target/pit-reports/desktop/
          retention-days: 14

  random-order:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: System programs for the tests (D-Bus, GNOME Keyring, desktop-file-validate)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-daemon gnome-keyring desktop-file-utils
      # the log names the seed: -Dsurefire.runOrder.random.seed=<seed> repeats the order
      - name: Build and test in a random order
        env:
          CCP_REQUIRE_PLATFORM: "1"
        run: ./mvnw -B clean verify -Dsurefire.runOrder=random
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: surefire-reports-random-order
          path: target/surefire-reports/
          retention-days: 7
