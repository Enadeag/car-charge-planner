SETUP_WELCOME = Welkom
SETUP_WELCOME_INTRO = Deze app vertelt je wanneer je je elektrische auto het beste kunt laden, zodat zo veel mogelijk stroom van je eigen zonnepanelen komt. Daarvoor zijn een paar gegevens over je huis en je auto nodig; het duurt een paar minuten.
SETUP_PRIVACY_TITLE = Wat je computer verlaat
SETUP_PRIVACY = Er verlaat niets je computer behalve wat de voorspelling nodig heeft. {0} krijgt {1} Er is geen account en je wordt niet gevolgd.
SETUP_PRIVACY_PLACE = De plaats die je bij Locatie typt, gaat naar {0} om hem te vinden.
SETUP_TYPICAL_TITLE = Weet je een waarde niet?
SETUP_TYPICAL = Druk op „Weet ik niet: gangbare waarden gebruiken”. De app neemt dan een gangbare waarde en markeert die, tot je je eigen waarde invult, hier of later bij Instellingen.
SETUP_CAR = Je auto
SETUP_MORE = Huis en afwezigheid
SETUP_MORE_HINT = Allebei optioneel: ze maken de planning beter, en je kunt ze ook later bij Instellingen invullen. Rijd je naar je werk, voeg dan de tijden toe waarop de auto weg is.
SETUP_CHECK = Voorspelling controleren
SETUP_CHECK_CARD = Voorspelling voor je huis
SETUP_CHECK_HINT = Er wordt één voorspelling gevraagd met wat je hebt ingevuld, zodat je weet dat het werkt voordat je klaar bent. Er is nog niets opgeslagen.
SETUP_CHECK_ASKING = {0} wordt om een voorspelling voor je huis gevraagd…
SETUP_CHECK_WORKS = {0} heeft geantwoord: {1,choice,1#één dag|1<{1} dagen} voorspelling voor je huis.
SETUP_CHECK_FAILED = {0}. Je kunt toch voltooien; de app probeert het zelf opnieuw.
SETUP_CHECK_AGAIN = Opnieuw controleren
SETUP_PREVIEW = Je dashboard
SETUP_PREVIEW_HINT = Dit is je dashboard, gepland met wat je hebt ingevuld. Voltooien slaat alles op; met Vorige kun je eerst nog iets aanpassen.
SETUP_DISPLAY_HINT = Taal en uiterlijk veranderen hier meteen, en Voltooien bewaart ze; hoe de app zich toont, de volgende keer dat hij start.
