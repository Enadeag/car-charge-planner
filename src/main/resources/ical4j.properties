# ical4j reads the calendar (engine.calendar.IcsReader).
# The calendars come from Google, Outlook, Nextcloud and others. Lines folded in other ways than RFC 5545 asks are
# read, and a time zone that cannot be found leaves a time without one, which the app reads in the home's time zone.
ical4j.unfolding.relaxed=true
ical4j.validation.relaxed=true
ical4j.compatibility.outlook=true
# Relaxed parsing stays off: it drops the time zone of Outlook's "TZID=UTC" times, which then read as local times.
ical4j.parsing.relaxed=false
# Never fetch newer time zone definitions from the network: the calendar's own and the ones ical4j brings are used.
net.fortuna.ical4j.timezone.update.enabled=false
