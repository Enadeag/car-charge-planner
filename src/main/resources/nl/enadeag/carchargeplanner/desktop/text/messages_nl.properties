PROVIDER_LIMITS = De app vraagt hooguit eens per {0,choice,1#minuut|1<{0} minuten} een voorspelling op. Die kijkt {1,choice,1#één dag|1<{1} dagen} vooruit.
PROVIDER_TERMS = Voorwaarden en limieten
PROVIDER_REQUIRED = Verplicht
PROVIDER_TEST = Testen
PROVIDER_TESTING = {0} wordt getest…
PROVIDER_WORKS = Werkt: {0,choice,1#één dag|1<{0} dagen} voorspelling.
PROVIDER_FAILED = Werkt niet. Details (in het Engels): {0}
PROVIDER_OPEN_METEO = Een gratis weerdienst van Open-Meteo.com. Die voorspelt het zonlicht op je panelen, en de app rekent dat om naar het vermogen van je systeem. Voor niet-commercieel gebruik.
PROVIDER_OPEN_METEO_SENDS = je locatie (breedte- en lengtegraad), je tijdzone en de helling en richting van je panelen; met een API-sleutel ook die sleutel.
PROVIDER_FORECAST_SOLAR = Een zonnestroomdienst die zelf de opbrengst van je systeem schat, inclusief de verliezen; de instelling Systeemverlies wordt daarom niet gebruikt. Het gratis abonnement geeft vandaag en morgen, per uur, en staat 12 aanvragen per uur toe voor iedereen achter je internetadres; elke panelengroep kost er één.
PROVIDER_FORECAST_SOLAR_SENDS = je locatie (breedte- en lengtegraad), de helling en richting van je panelen en hun vermogen in kWp; met een API-sleutel ook die sleutel.
PROVIDER_API_KEY = API-sleutel
PROVIDER_BASE_URL = Serveradres
PROVIDER_OPEN_METEO_API_KEY_HINT = Alleen voor een betaald abonnement (commercieel gebruik). Gratis gebruik heeft er geen nodig.
PROVIDER_OPEN_METEO_BASE_URL_HINT = Laat leeg voor de gratis openbare dienst. Een betaald abonnement, of een eigen server, heeft een eigen adres.
PROVIDER_FORECAST_SOLAR_API_KEY_HINT = Alleen voor een betaald abonnement, dat meer dagen en kleinere stappen geeft. Het gratis abonnement heeft er geen nodig.
SECRET_SHOW = Tonen
SECRET_HIDE = Verbergen
SECRET_LOCKED = Vergrendeld in je sleutelbos
SECRET_REPLACE = Nieuwe API-sleutel invoeren
SECRET_LOCKED_SPOKEN = {0}: vergrendeld in je sleutelbos. Nieuwe API-sleutel invoeren
CARD_KEYS = API-sleutels
KEYS_IN_KEYCHAIN = API-sleutels staan in de sleutelbos van het systeem, niet in de instellingenbestanden.
KEYS_IN_FILE = Er is geen sleutelbos van het systeem beschikbaar, dus API-sleutels staan in {0}, dat alleen jij kunt lezen.
KEYS_IN_LOCKED_KEYCHAIN = API-sleutels staan in de sleutelbos van het systeem, maar die is vergrendeld, dus ze kunnen nog niet gelezen worden. Ontgrendel je sleutelbos en open Instellingen opnieuw; sla je nu een API-sleutel op, dan vraagt je systeem je eerst de sleutelbos te ontgrendelen.
KEYS_PROBLEM = Je opgeslagen API-sleutels konden niet gelezen worden. Vul ze opnieuw in en sla op.
CARD_AWAY = Elke week afwezig
CARD_AWAY_HINT = Tijden in elke week waarop de auto niet thuis is. Dan plant de app geen laadvensters. Eén periode geldt voor één weekdag: voeg er meer toe voor meer dagen.
AWAY_NONE = Geen: de planning gaat ervan uit dat de auto de hele week thuis is.
AWAY_ADD = Afwezigheid toevoegen
AWAY_REMOVE = Verwijderen
AWAY_FROM = van
AWAY_TO = tot
AWAY_WEEKDAY = Weekdag van de afwezigheid
AWAY_FROM_FIELD = Afwezig vanaf
AWAY_TO_FIELD = Afwezig tot
AWAY_PERIOD_NUMBER = afwezigheid {0}
CARD_SET_UP = Instelhulp
CARD_SET_UP_HINT = Doorloop de instelhulp opnieuw, ingevuld met wat nu is opgeslagen.
RUN_SET_UP = Instelhulp opnieuw doorlopen
PROBLEM_NO_PLACE = Kies waar je huis staat: zoek het hierboven op, of typ de coördinaten.
NOT_SET_UP_FIRST = Beschrijf je huis, je zonnepanelen en je auto, en de app plant wanneer je laadt. Het duurt een paar minuten.
START_SET_UP = Instelhulp starten
MENU_SET_UP = Instelhulp…
TRAY_NOT_SET_UP_FIRST = Nog niet ingesteld: kies Instelhulp in het menu.
SET_UP_TITLE = Instelhulp – {0}
SET_UP_STEP = Stap {0} van {1}
SET_UP_PROGRESS = Stap {0} van {1}: {2}
SET_UP_BACK = Vorige
SET_UP_NEXT = Volgende
SET_UP_FINISH = Voltooien
SET_UP_CANCEL = Annuleren
SET_UP_LEAVE_QUESTION = Instelhulp verlaten? Er is nog niets opgeslagen.
SET_UP_KEEP_GOING = Doorgaan
SET_UP_LEAVE = Instelhulp verlaten
SET_UP_REFUSED = Sommige waarden vragen aandacht: kijk bij de gemarkeerde velden.
SET_UP_WELCOME = Welkom
SET_UP_WELCOME_INTRO = Deze app vertelt je wanneer je je elektrische auto het beste kunt laden, zodat zo veel mogelijk stroom van je eigen zonnepanelen komt. Daarvoor zijn een paar gegevens over je huis en je auto nodig; het duurt een paar minuten.
SET_UP_PRIVACY_TITLE = Wat je computer verlaat
SET_UP_PRIVACY = Er verlaat niets je computer behalve wat de voorspelling nodig heeft. {0} krijgt {1} Er is geen account en je wordt niet gevolgd.
SET_UP_PRIVACY_PLACE = De plaats die je bij Locatie typt, gaat naar {0} om hem te vinden.
SET_UP_TYPICAL_TITLE = Weet je een waarde niet?
SET_UP_TYPICAL = Druk op “Weet ik niet: gangbare waarden gebruiken”. De app neemt dan een gangbare waarde en markeert die, tot je je eigen waarde invult, hier of later bij Instellingen.
SET_UP_CAR = Je auto
SET_UP_MORE = Huis en afwezigheid
SET_UP_MORE_HINT = Allebei optioneel: ze maken de planning beter, en je kunt ze ook later bij Instellingen invullen. Rijd je naar je werk, voeg dan de tijden toe waarop de auto afwezig is.
SET_UP_CHECK = Voorspelling controleren
SET_UP_CHECK_CARD = Voorspelling voor je huis
SET_UP_CHECK_HINT = Er wordt één voorspelling opgevraagd met wat je hebt ingevuld, zodat je weet dat het werkt voordat je klaar bent. Er is nog niets opgeslagen.
SET_UP_CHECK_ASKING = Er wordt een voorspelling voor je huis opgevraagd bij {0}…
SET_UP_CHECK_WORKS = {0} heeft geantwoord: {1,choice,1#één dag|1<{1} dagen} voorspelling voor je huis.
SET_UP_CHECK_FAILED = Dat lukte niet. Details (in het Engels): {0}. Je kunt toch voltooien; de app probeert het zelf opnieuw.
SET_UP_CHECK_AGAIN = Opnieuw controleren
SET_UP_PREVIEW = Je dashboard
SET_UP_PREVIEW_HINT = Dit is je dashboard, gepland met wat je hebt ingevuld. Voltooien slaat alles op; met Vorige kun je eerst nog iets aanpassen.
SET_UP_DISPLAY_HINT = Taal en uiterlijk veranderen hier meteen, en Voltooien bewaart ze. De manier waarop de app zich toont, verandert pas bij de volgende start.
