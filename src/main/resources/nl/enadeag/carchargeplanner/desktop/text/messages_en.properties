SET_UP_TYPICAL = Press “I don''t know: use typical values”. The app then uses a typical value and marks it, until you enter your own, here or later in Settings.
SET_UP_CAR = Your car
SET_UP_MORE = House and away periods
SET_UP_MORE_HINT = Both are optional: they make the plan better, and you can also set them later in Settings. If you drive to work, add the periods the car is away.
SET_UP_CHECK = Check the forecast
SET_UP_CHECK_CARD = Forecast for your home
SET_UP_CHECK_HINT = The app asks for one forecast with what you entered, so you know it works before you finish. Nothing is saved yet.
SET_UP_CHECK_ASKING = Asking {0} for a forecast for your home…
SET_UP_CHECK_WORKS = {0} answered: {1,choice,1#one day|1<{1} days} of forecast for your home.
SET_UP_CHECK_FAILED = {0}. You can still finish; the app tries again by itself.
SET_UP_CHECK_AGAIN = Check again
SET_UP_PREVIEW = Your dashboard
SET_UP_PREVIEW_HINT = This is your dashboard, planned with what you entered. Finish saves it all; Back lets you change something first.
SET_UP_DISPLAY_HINT = Language and appearance change here at once, and Finish keeps them. How the app shows itself changes the next time it starts.
